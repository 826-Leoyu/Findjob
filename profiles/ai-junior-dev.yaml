# 安大略省内，利用 AI 编程的初级开发岗位；接受远程。
name: ai-junior-dev
enabled: true

# 搜索词：逐个提交给各数据源；粗筛时每个词命中职位名计 2 分、只在 JD 中命中计 1 分。
# 带 AI 字样的职位名很少，所以也包含通用初级开发职位，靠 AI 相关词提高粗分。
keywords:
  - junior software developer
  - junior software engineer
  - junior developer
  - entry level developer
  - new grad software engineer
  - AI developer
  - AI engineer
  - LLM
  - generative AI
  - AI-assisted development
  - Claude
  - prompt engineering
  - Python developer
  - full stack developer
  - React
  - TypeScript

# 只对原始职位名判断：整词命中即过滤（不区分大小写，带标点的词如 sr. 按原样匹配）；JD 中出现不过滤。
exclude:
  - senior
  - sr.
  - lead
  - principal
  - staff engineer
  - manager
  - director
  - architect
  - sales
  - security clearance

# 城市（"Windsor, ON"，按 50 km 半径搜）或省份（"Ontario" / "ON"，搜全省）。
locations:
  - Ontario

remote: true            # 接受远程岗位（限加拿大境内可远程的岗位）
max_experience_years: 2 # JD 要求的年限超过此值即过滤

# 可选：Greenhouse / Lever / Ashby 公司标识，第 10 步启用。
ats_companies: []
